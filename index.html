<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MTN Cloud Pricing Calculator</title>

  <!--
    PERFORMANCE: Start TCP/TLS handshakes to the heaviest downstream origins
    in parallel with this page's render. By the time the iframe actually
    requests script.google.com, the connection is already warm — saving
    ~100–300ms on cold loads. Adding the cdnjs origin so xlsx (when
    lazy-loaded after user clicks Export) also benefits.
  -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://mtn-bucket-morph-test.s3.us-east-1.amazonaws.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden; /* Prevents body scroll, allowing wrapper to scroll */
      background: #0a0a0a;
    }

    /* ── SCROLLING FIX FOR MOBILE IFRAMES ── */
    .iframe-wrapper {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    #loader {
      position: fixed; inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      z-index: 10;
      transition: opacity 0.6s;
    }

    /* ── Cloud ── */
    .cloud-wrap {
      position: relative;
      width: 100px;
      height: 60px;
      animation: drift 2.4s ease-in-out infinite alternate;
    }
    .cloud-body {
      position: absolute;
      bottom: 0; left: 0;
      width: 100px; height: 40px;
      background: #f9c600;
      border-radius: 40px;
    }
    .cloud-body::before {
      content: '';
      position: absolute;
      width: 50px; height: 50px;
      background: #f9c600;
      border-radius: 50%;
      top: -24px; left: 12px;
    }
    .cloud-body::after {
      content: '';
      position: absolute;
      width: 32px; height: 32px;
      background: #f9c600;
      border-radius: 50%;
      top: -14px; left: 48px;
    }

    /* Rain drops */
    .rain {
      position: absolute;
      bottom: -18px;
      display: flex;
      gap: 10px;
      left: 22px;
    }
    .drop {
      width: 3px; height: 10px;
      background: #f9c600;
      border-radius: 2px;
      opacity: 0;
      animation: fall 1.2s ease-in infinite;
    }
    .drop:nth-child(1) { animation-delay: 0s; }
    .drop:nth-child(2) { animation-delay: 0.2s; }
    .drop:nth-child(3) { animation-delay: 0.4s; }
    .drop:nth-child(4) { animation-delay: 0.15s; }
    .drop:nth-child(5) { animation-delay: 0.35s; }

    @keyframes drift {
      from { transform: translateY(0); }
      to   { transform: translateY(-12px); }
    }
    @keyframes fall {
      0%   { opacity: 0; transform: translateY(0); }
      30%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(14px); }
    }

    /* ── Dots loader bar ── */
    .dots {
      display: flex;
      gap: 8px;
    }
    .dot {
      width: 8px; height: 8px;
      background: #f9c600;
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50%        { opacity: 1;   transform: scale(1.2); }
    }

    /* ── LOAD ERROR FALLBACK ──
       Shown only if the app fails to load within the timeout window, so a
       visitor is never stranded on an infinite loader. Uses the same palette
       as the loader to stay on-brand. */
    #load-error {
      position: fixed; inset: 0;
      background: #0a0a0a;
      display: none;            /* JS switches this to flex on timeout */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      text-align: center;
      z-index: 11;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #load-error .err-icon { font-size: 2.4rem; }
    #load-error .err-title {
      color: #f9c600; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; font-size: 1.05rem;
    }
    #load-error .err-msg { color: #aaa; font-size: 0.9rem; line-height: 1.6; max-width: 360px; }
    #load-error .err-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    #load-error a, #load-error button {
      background: #f9c600; color: #000; border: none; cursor: pointer;
      padding: 12px 26px; border-radius: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem;
      text-decoration: none; transition: background 0.2s;
    }
    #load-error a.secondary, #load-error button.secondary {
      background: transparent; color: #fff; border: 1px solid #333;
    }
    #load-error a:hover, #load-error button:hover { background: #d4a800; }
    #load-error a.secondary:hover, #load-error button.secondary:hover { background: #161616; }
  </style>
</head>
<body>

  <div id="loader">
    <div class="cloud-wrap">
      <div class="cloud-body"></div>
      <div class="rain">
        <div class="drop"></div>
        <div class="drop"></div>
        <div class="drop"></div>
        <div class="drop"></div>
        <div class="drop"></div>
      </div>
    </div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <div id="load-error">
    <div class="err-icon">☁️</div>
    <div class="err-title">Couldn't load the calculator</div>
    <div class="err-msg">The pricing app is taking longer than expected to respond. Check your connection and try again, or open it directly.</div>
    <div class="err-actions">
      <button onclick="location.reload()">Reload</button>
      <a class="secondary" href="https://script.google.com/macros/s/AKfycbyUd2zrI5kz8ybwOM2afc3bHjSkrIF1X-2Wlltznpg9Gvi8uMBBiaOeKaMPtEGY878/exec" target="_blank" rel="noopener">Open Directly</a>
    </div>
  </div>

  <div class="iframe-wrapper">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbyUd2zrI5kz8ybwOM2afc3bHjSkrIF1X-2Wlltznpg9Gvi8uMBBiaOeKaMPtEGY878/exec"
      title="MTN Cloud Pricing Calculator"
      allowfullscreen
      loading="eager"
      scrolling="yes"
    ></iframe>
  </div>

  <script>
    const iframe   = document.getElementById('app');
    const loader   = document.getElementById('loader');
    const errorBox = document.getElementById('load-error');

    function hideLoader() {
      loader.style.opacity = '0';
      setTimeout(() => { if (loader.parentNode) loader.remove(); }, 600);
    }

    // RELIABILITY: previously the loader only ever hid on a successful iframe
    // 'load' event, so a failed/slow/offline load left the animation spinning
    // forever. This fallback stops it after 20s and offers a retry.
    const failTimer = setTimeout(() => {
      hideLoader();
      errorBox.style.display = 'flex';
    }, 20000);

    iframe.addEventListener('load', () => {
      clearTimeout(failTimer);   // app loaded fine — cancel the fallback
      errorBox.style.display = 'none';
      hideLoader();
    });
  </script>

</body>
</html>
